# NOT RUN YET. The 5-round baseline (configs/main.yaml) on DeepSeek V4.1 Flash with one change:
#   * max_output_tokens: 4500 -> hard cap per call (default 64000). The cap includes the model's
#                                reasoning, so a call that runs past it is cut off and retried.
# Reasoning stays on (effort high), as in main.yaml. This is a different condition from the
# uncapped runs; do not pool the two.
#
#   python -m experiments --config external/channel_study/configs/baseline-5round-deepseek-cap.yaml --start-index 1 --repeats 1 --parallel 1

alice:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "deepinfra/fp8"               # pinned: fp8, $0.14/$0.42 per M; fallbacks are off

bob:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

run:
  task_sequence_record: [task/task_sequences_25x10]   # identical to task_sequences_50x10 reps 1-25
  repeats: 15
  parallel: 8
  output_dir: external/data/channel_study/results/runs/baseline-5round-deepseek-cap

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: xhigh
  provider: ""
  temperature: 0.0
  workers: 8
  verdict_policy: raw-only
