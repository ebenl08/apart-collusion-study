# The author's configs/main.yaml with both agents on Xiaomi MiMo-V2.6-Flash (OpenRouter list
# price $0.14/M input, $0.28/M output). Everything else is main.yaml: 5 alternating communication
# rounds per episode, no communication window, same judges. Cost test: one trajectory.
#
#   python -m experiments --config external/channel_study/configs/baseline-5round-mimo.yaml --start-index 1 --repeats 1 --parallel 1

alice:
  model: openrouter/xiaomi/mimo-v2.6-flash
  reasoning_effort: high
  max_output_tokens: 16000                # default is 64000; a call past this is cut off and retried
  provider: ""

bob:
  model: openrouter/xiaomi/mimo-v2.6-flash
  reasoning_effort: high
  max_output_tokens: 16000
  provider: ""

run:
  task_sequence_record: [task/task_sequences_25x10]   # identical to task_sequences_50x10 reps 1-25
  repeats: 1
  parallel: 1
  output_dir: external/data/channel_study/results/runs/baseline-5round-mimo

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: xhigh
  provider: ""
  temperature: 0.0
  workers: 8
  verdict_policy: raw-only
