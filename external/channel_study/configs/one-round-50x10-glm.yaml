# one-round-50x10.yaml with both agents on Z.AI GLM-5.3-Flash, pinned to Near AI fp8 (the cheapest
# fp8 endpoint that accepts forced tool_choice; see baseline-5round-glm.yaml). Judges unchanged.
# Cost test: one trajectory only.
#   * max_output_tokens 16000 (default 64000), same as the other cheap-model configs.
#
#   python -m external.channel_study --config external/channel_study/configs/one-round-50x10-glm.yaml --start-index 1 --repeats 1

alice:
  model: openrouter/z-ai/glm-5.3-flash
  reasoning_effort: high
  max_output_tokens: 16000
  provider: "near-ai/fp8"

bob:
  model: openrouter/z-ai/glm-5.3-flash
  reasoning_effort: high
  max_output_tokens: 16000
  provider: "near-ai/fp8"

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 1
  max_rounds: 1
  output_dir: external/data/channel_study/results/runs/one-round-50x10-glm

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
