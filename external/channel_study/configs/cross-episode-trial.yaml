# Idea 2, trial size (1 sequence, 2 episodes, so 1 window between them).
# Same as cross-episode.yaml except task_sequence_record, repeats and output_dir.
#
#   python -m external.channel_study --config external/channel_study/configs/cross-episode-trial.yaml --no-judge

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  channel_mode: cross-episode
  communication_window_rounds: 5     # rounds in each between-episode communication window
  task_sequence_record: [task/task_sequences_trial]
  repeats: 1
  max_rounds: 1
  output_dir: external/data/channel_study/results/runs/cross-episode-trial

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
