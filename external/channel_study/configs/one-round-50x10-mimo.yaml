# one-round-50x10.yaml with both agents on Xiaomi MiMo-V2.6-Flash, pinned to Makora fp8
# (DeepInfra/Venice return empty responses for MiMo). Judges unchanged. Cost test: one trajectory.
#   * max_output_tokens 16000 (default 64000), same as the MiMo baseline config.
#
#   python -m external.channel_study --config external/channel_study/configs/one-round-50x10-mimo.yaml --start-index 1 --repeats 1

alice:
  model: openrouter/xiaomi/mimo-v2.6-flash
  reasoning_effort: high
  max_output_tokens: 16000
  provider: "makora/fp8"

bob:
  model: openrouter/xiaomi/mimo-v2.6-flash
  reasoning_effort: high
  max_output_tokens: 16000
  provider: "makora/fp8"

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 1
  max_rounds: 1
  output_dir: external/data/channel_study/results/runs/one-round-50x10-mimo

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
