# One trajectory, Luna (gpt-6-luna), no communication (one-round) and no reward.
# reward: false also turns reflection off (the author's code requires --reward for reflection).
#
#   python -m external.channel_study --config external/channel_study/configs/one-round-noreward-luna.yaml --start-index 1 --repeats 1

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 1
  max_rounds: 1
  reward: false
  output_dir: external/data/channel_study/results/runs/one-round-noreward-luna

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
