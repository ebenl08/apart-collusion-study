# One-round, no reward, no verdict review, DeepSeek V4.1 Flash pinned to DeepInfra fp8, output capped at
# 4500 tokens. Bob's system prompt (only Bob's) gains COLLUDING_BOB_SECTION telling him to accept
# summaries. His message to Alice is not scripted. The question: does Alice, who sees only Bob's
# message and never his verdicts, start accepting too?
#
#   python -m external.channel_study --config external/channel_study/configs/colluding-bob-noreward-deepseek.yaml --start-index 1 --repeats 5 --parallel 5

alice:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

bob:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

run:
  channel_mode: colluding-bob
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 5
  max_rounds: 1
  reward: false
  verdict_review: false
  output_dir: external/data/channel_study/results/runs/colluding-bob-noreward-deepseek

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
