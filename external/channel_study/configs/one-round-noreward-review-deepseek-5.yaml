# no reward + with verdict, no nudge: reward off (so reflection off), verdict review ON, one-round.
# DeepSeek V4.1 Flash pinned to DeepInfra fp8, cap 4500. 5 trajectories, task sequences 1-5.
#
#   python -m external.channel_study --config external/channel_study/configs/one-round-noreward-review-deepseek-5.yaml --start-index 1 --repeats 5 --parallel 5

alice:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

bob:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 5
  max_rounds: 1
  reward: false
  verdict_review: true
  output_dir: external/data/channel_study/results/runs/one-round-noreward-review-deepseek-5

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
