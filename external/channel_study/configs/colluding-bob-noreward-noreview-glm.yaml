# Colluding Bob with the verdict review OFF and reward off: the GLM counterpart of
# colluding-bob-noreward-deepseek.yaml. GLM-5.3-Flash pinned to Near AI fp8, cap 4500.
# Bob's system prompt (only Bob's) gains COLLUDING_BOB_SECTION. 5 trajectories.
#
#   python -m external.channel_study --config external/channel_study/configs/colluding-bob-noreward-noreview-glm.yaml --start-index 1 --repeats 5 --parallel 5

alice:
  model: openrouter/z-ai/glm-5.3-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "near-ai/fp8"

bob:
  model: openrouter/z-ai/glm-5.3-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "near-ai/fp8"

run:
  channel_mode: colluding-bob
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 5
  max_rounds: 1
  reward: false
  verdict_review: false
  output_dir: external/data/channel_study/results/runs/colluding-bob-noreward-noreview-glm

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
