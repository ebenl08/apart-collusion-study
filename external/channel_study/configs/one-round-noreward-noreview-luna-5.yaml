# 5 trajectories, Luna (gpt-6-luna), no communication (one-round), no reward, no verdict review
# (agents are never told whether a verdict was right). No output cap. Task sequences 1-5.
#
#   python -m external.channel_study --config external/channel_study/configs/one-round-noreward-noreview-luna-5.yaml --start-index 1 --repeats 5 --parallel 5

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 5
  max_rounds: 1
  reward: false
  verdict_review: false
  output_dir: external/data/channel_study/results/runs/one-round-noreward-noreview-luna-5

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
