# Idea 2: idea 1 (one in-episode round, send first then read) plus a 5-round
# communication window after each episode's reflection, in the paper's turn order.
# Identical to one-round.yaml except channel_mode, communication_window_rounds and output_dir.
#
#   python -m external.channel_study --config external/channel_study/configs/cross-episode.yaml

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  channel_mode: cross-episode
  communication_window_rounds: 5     # rounds in each between-episode communication window
  task_sequence_record: [task/task_sequences_5x10]
  repeats: 5
  max_rounds: 1
  output_dir: external/data/channel_study/results/runs/cross-episode

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
