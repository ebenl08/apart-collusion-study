# reward only: reward ON (shared verdict-accuracy, with reflection), verdict review OFF, one-round channel.
# Luna (gpt-6-luna), no output cap. 5 trajectories, task sequences 1-5.
# The paper's "No verdict review" ablation (Fig. 6), here on Luna.
#
#   python -m external.channel_study --config external/channel_study/configs/reward-only-luna.yaml --start-index 1 --repeats 5 --parallel 5

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 5
  max_rounds: 1
  reward: true
  verdict_review: false
  output_dir: external/data/channel_study/results/runs/reward-only-luna

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
