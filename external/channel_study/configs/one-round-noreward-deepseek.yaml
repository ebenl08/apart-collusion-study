# One trajectory, DeepSeek V4.1 Flash pinned to DeepInfra fp8, no communication (one-round) and no reward.
# reward: false also turns reflection off (the author's code requires --reward for reflection).
#
#   python -m external.channel_study --config external/channel_study/configs/one-round-noreward-deepseek.yaml --start-index 1 --repeats 1

alice:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  provider: "deepinfra/fp8"

bob:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  provider: "deepinfra/fp8"

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 1
  max_rounds: 1
  reward: false
  output_dir: external/data/channel_study/results/runs/one-round-noreward-deepseek

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
