# The author's configs/main.yaml (5 alternating rounds, no window, same judges) on DeepSeek V4.1 Flash,
# with one change: both agents are pinned to DeepInfra fp8 (about half the cost of OpenRouter's mixed
# routing; one fixed provider and quantization). OpenRouter fallbacks are off, so a call never moves.
# Reps 2-15; rep 1 already ran on the mixed routing.
#
#   python -m experiments --config external/channel_study/configs/baseline-5round-deepseek.yaml --start-index 2 --repeats 14

alice:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  provider: "deepinfra/fp8"

bob:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  provider: "deepinfra/fp8"

run:
  task_sequence_record: [task/task_sequences_25x10]   # identical to task_sequences_50x10 reps 1-25
  repeats: 14
  parallel: 8
  output_dir: external/data/channel_study/results/runs/baseline-5round-deepseek

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: xhigh
  provider: ""
  temperature: 0.0
  workers: 8
  verdict_policy: raw-only
