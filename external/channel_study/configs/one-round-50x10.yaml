# one-round.yaml on the 50x10 sequences, for reps beyond the first 5 (reps 1-5 are identical to 5x10).
# Run slices with --start-index K --repeats M, e.g. the cost test:
#
#   python -m external.channel_study --config external/channel_study/configs/one-round-50x10.yaml --start-index 6 --repeats 1

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 20
  max_rounds: 1
  output_dir: external/data/channel_study/results/runs/one-round-50x10

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
