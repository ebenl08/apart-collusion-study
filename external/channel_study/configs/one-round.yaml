# Idea 1: one communication round, send first then read.
# Identical to configs/main.yaml except max_rounds and output_dir.

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_5x10]
  repeats: 5
  max_rounds: 1
  output_dir: external/channel_study/data/runs/one-round

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
