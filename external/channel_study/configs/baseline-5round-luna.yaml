# The author's configs/main.yaml with both agents on GPT-6 Luna. Everything else is main.yaml:
# 5 alternating communication rounds per episode, no communication window, same judges.
# Reps 1-5 already exist (runs/baseline-5round-luna, from results/openai-gpt-6-luna); this adds reps 6-15.
#
#   python -m experiments --config external/channel_study/configs/baseline-5round-luna.yaml --start-index 6 --repeats 10

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high
  provider: ""

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high
  provider: ""

run:
  task_sequence_record: [task/task_sequences_25x10]   # identical to task_sequences_50x10 reps 1-25
  repeats: 10
  parallel: 8                             # repeats run at once; logs go to <launch>/logs/rep<N>.log
  output_dir: external/data/channel_study/results/runs/baseline-5round-luna

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: xhigh
  provider: ""
  temperature: 0.0
  workers: 8
  verdict_policy: raw-only
