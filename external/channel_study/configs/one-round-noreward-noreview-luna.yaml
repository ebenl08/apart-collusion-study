# One trajectory, Luna (gpt-6-luna), no communication (one-round), no reward, no verdict review
# (agents are never told whether a verdict was right), output capped at 4000 tokens per call
# (the cap includes reasoning, so a call that runs past it is cut off and retried).
#
#   python -m external.channel_study --config external/channel_study/configs/one-round-noreward-noreview-luna.yaml --start-index 1 --repeats 1

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high
  max_output_tokens: 4000

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high
  max_output_tokens: 4000

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 1
  max_rounds: 1
  reward: false
  verdict_review: false
  output_dir: external/data/channel_study/results/runs/one-round-noreward-noreview-luna

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
