# one-round-50x10.yaml with both agents on DeepSeek V4.1 Flash. Judges unchanged, so the
# results compare directly with the Luna runs on the same task sequences.
#
#   python -m external.channel_study --config external/channel_study/configs/one-round-50x10-deepseek.yaml --start-index 6 --repeats 1

alice:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high

bob:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 25
  max_rounds: 1
  output_dir: external/data/channel_study/results/runs/one-round-50x10-deepseek

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
