# 10 trajectories, DeepSeek V4.1 Flash pinned to DeepInfra fp8, no communication (one-round), no reward,
# no verdict review (agents are never told whether a verdict was right), output capped at 4500 tokens
# per call (the cap includes reasoning). Task sequences 1-10 of task_sequences_50x10.
#
#   python -m external.channel_study --config external/channel_study/configs/one-round-noreward-noreview-deepseek-10.yaml --start-index 1 --repeats 10 --parallel 5

alice:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

bob:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 10
  max_rounds: 1
  reward: false
  verdict_review: false
  output_dir: external/data/channel_study/results/runs/one-round-noreward-noreview-deepseek-10

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
