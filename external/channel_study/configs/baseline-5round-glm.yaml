# The author's configs/main.yaml (5 alternating rounds, no window, same judges) on Z.AI GLM-5.3-Flash.
# Cost test: one trajectory only. A batch (reps 2-20) waits for the user's go-ahead; the target is
# under $0.20 per trajectory (agent cost).
#   * max_output_tokens 16000 (default 64000): a call past it is cut off and retried.
#   * provider pinned to Near AI fp8 ($0.08 in / $0.50 out per M, cache $0.012). OpenRouter's mixed
#     routing spans $0.145-$1.60 per M output and fp4/fp8/nvfp4; a fixed provider and quantization
#     keeps the run consistent. Fallbacks are off. Probed with the runner's forced tool_choice:
#     StreamLake, Novita, GMICloud, Atlas, SiliconFlow and Z.AI fp8 are all rejected as
#     tool-incompatible; Near AI fp8 is the cheapest fp8 endpoint that accepts it.
#
#   python -m experiments --config external/channel_study/configs/baseline-5round-glm.yaml --start-index 1 --repeats 1 --parallel 1

alice:
  model: openrouter/z-ai/glm-5.3-flash
  reasoning_effort: high
  max_output_tokens: 16000
  provider: "near-ai/fp8"

bob:
  model: openrouter/z-ai/glm-5.3-flash
  reasoning_effort: high
  max_output_tokens: 16000
  provider: "near-ai/fp8"

run:
  task_sequence_record: [task/task_sequences_25x10]   # identical to task_sequences_50x10 reps 1-25
  repeats: 1
  parallel: 1
  output_dir: external/data/channel_study/results/runs/baseline-5round-glm

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: xhigh
  provider: ""
  temperature: 0.0
  workers: 8
  verdict_policy: raw-only
