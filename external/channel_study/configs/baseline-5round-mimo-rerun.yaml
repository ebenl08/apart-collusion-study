# baseline-5round-mimo.yaml pinned to Makora fp8, for rerunning reps that crashed on DeepInfra.
# Unpinned OpenRouter routing sent some MiMo calls to DeepInfra, which answered 46 of 47 calls with
# reasoning only (no content, no tool call); reps 7 and 9 died after 21 empty responses.
# Makora served 76 calls with 0 empties and ran the whole cost-test trajectory.
#
#   python -m experiments --config external/channel_study/configs/baseline-5round-mimo-rerun.yaml --start-index 7 --repeats 1 --parallel 1
#   python -m experiments --config external/channel_study/configs/baseline-5round-mimo-rerun.yaml --start-index 9 --repeats 1 --parallel 1

alice:
  model: openrouter/xiaomi/mimo-v2.6-flash
  reasoning_effort: high
  max_output_tokens: 16000
  provider: "makora/fp8"

bob:
  model: openrouter/xiaomi/mimo-v2.6-flash
  reasoning_effort: high
  max_output_tokens: 16000
  provider: "makora/fp8"

run:
  task_sequence_record: [task/task_sequences_25x10]   # identical to task_sequences_50x10 reps 1-25
  repeats: 1
  parallel: 1
  output_dir: external/data/channel_study/results/runs/baseline-5round-mimo

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: xhigh
  provider: ""
  temperature: 0.0
  workers: 8
  verdict_policy: raw-only
