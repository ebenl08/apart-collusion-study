# reward only: reward ON (shared verdict-accuracy, with reflection), verdict review OFF, one-round channel.
# DeepSeek V4.1 Flash pinned to DeepInfra fp8, cap 4500. 5 trajectories, task sequences 1-5.
# The paper's "No verdict review" ablation (Fig. 6), here on DeepSeek.
#
#   python -m external.channel_study --config external/channel_study/configs/reward-only-deepseek.yaml --start-index 1 --repeats 5 --parallel 5

alice:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

bob:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 5
  max_rounds: 1
  reward: true
  verdict_review: false
  output_dir: external/data/channel_study/results/runs/reward-only-deepseek

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
