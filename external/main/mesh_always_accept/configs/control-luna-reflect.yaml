# Control, Luna, "no reward + with verdict + reflection": no communication (one blind round), live Alice and
# live Bob, no nudge, no replay.
#
#   python -m external.main.mesh_always_accept --config external/main/mesh_always_accept/configs/control-luna-reflect.yaml
#
# As control-haiku.yaml with both agents on gpt-6-luna (effort high, no cap), plus a private reflection after
# each episode for both agents with the reward off (--reflection-no-reward, prompt REFLECTION_PROMPT_NO_REWARD
# in persuader.py). The existing Luna control without reflection (25 trajectories) ran through
# external.channel_study; this one goes through the persuader child with no nudge.
# Pilot: 5 trajectories (reps 1-5).

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 5
  parallel: 5
  max_rounds: 1
  reward: false
  verdict_review: true
  child_module: external.main.mesh_always_accept.persuader
  child_args: [--reflection-no-reward]
  judge: false                            # judges run during analysis
  output_dir: external/data/main/results/mesh_always_accept/runs/control-luna-reflect
