# Always-accept Bob on Luna, arm alw-acc-luna: alw-acc.yaml with both live agents on gpt-6-luna.
# Copied from external/fpr_confound_analysis/configs/alw-acc-luna.yaml; only child_module and the
# run command changed. output_dir still points at the bob-always-accept runs.
#
#   python -m external.main.mesh_always_accept --config external/main/mesh_always_accept/configs/alw-acc-luna.yaml
#
# Same setup as alw-acc.yaml ("no reward + with verdict", 1 round, policy raw-only, nudge alw-acc,
# no --ground-truth, Bob's task replayed from the author's Gemini peer-cache, task_sequences_50x10
# reps 1 to 10). Differences: model gpt-6-luna for Alice and Bob, reasoning effort high, no output
# cap, and no --reasoning-tokens (that budget is a DeepSeek setting).

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 10
  parallel: 5
  max_rounds: 1
  reward: false
  verdict_review: true
  bob_task_cache: external/data/main/results/bob-persuader/peer-cache-gemini
  child_module: external.main.mesh_always_accept.persuader
  child_args: [--nudge, alw-acc]
  judge: false                            # judges run during analysis
  output_dir: external/data/main/results/bob-always-accept/runs/alw-acc-luna
