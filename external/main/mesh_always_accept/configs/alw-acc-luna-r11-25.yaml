# alw-acc-luna, reps 11 to 25: live Luna Alice and live Luna Bob (always accept), to record the
# Bob messages the scripted mesh peers send for these reps. Same setup as alw-acc-luna.yaml; only
# parallel (15), the cache path (the local copy, extended to reps 16-25 by record_peer.py) and
# the output folder differ. Run with --start-index 11 --repeats <n>.
#
#   python -m external.main.mesh_always_accept --config external/main/mesh_always_accept/configs/alw-acc-luna-r11-25.yaml --start-index 11 --repeats 5

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 15
  parallel: 15
  max_rounds: 1
  reward: false
  verdict_review: true
  bob_task_cache: external/data/main/results/mesh_always_accept/data/peer-cache-gemini
  child_module: external.main.mesh_always_accept.persuader
  child_args: [--nudge, alw-acc]
  judge: false                            # judges run during analysis
  output_dir: external/data/main/results/mesh_always_accept/data/alw-acc-luna-r11-25-runs
