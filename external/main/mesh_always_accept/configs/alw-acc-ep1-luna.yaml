# Always-accept Bob that persuades Alice from episode 1, on Luna (arm alw-acc-ep1-luna).
# Copied from external/fpr_confound_analysis/configs/alw-acc-ep1-luna.yaml; only child_module and
# the run command changed. output_dir still points at the bob-always-accept runs.
#
#   python -m external.main.mesh_always_accept --config external/main/mesh_always_accept/configs/alw-acc-ep1-luna.yaml
#
# alw-acc-ep1.yaml with both live agents on gpt-6-luna (effort high, no output cap), as in
# alw-acc-luna.yaml. Nudge alw-acc-ep1 (text in persuader.py), no --ground-truth, no
# --reasoning-tokens (a DeepSeek setting). Bob's task is replayed from the author's Gemini
# peer-cache, task_sequences_50x10 reps 1 to 10.

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 10
  parallel: 5
  max_rounds: 1
  reward: false
  verdict_review: true
  bob_task_cache: external/data/main/results/bob-persuader/peer-cache-gemini
  child_module: external.main.mesh_always_accept.persuader
  child_args: [--nudge, alw-acc-ep1]
  judge: false                            # judges run during analysis
  output_dir: external/data/main/results/bob-always-accept/runs/alw-acc-ep1-luna
