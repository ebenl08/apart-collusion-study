# Mesh arm N=5, Luna, "no reward + with verdict + reflection": live Alice and 4 scripted always-accept peers.
#
#   python -m external.main.mesh_always_accept --config external/main/mesh_always_accept/configs/mesh-n5-reflect.yaml
#
# As mesh-n2-reflect.yaml, with --peers 4. Pilot: 5 trajectories (reps 1-5).

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 5
  parallel: 5
  max_rounds: 1
  reward: false
  verdict_review: true
  bob_task_cache: external/data/main/results/mesh_always_accept/data/peer-cache-gemini
  child_module: external.main.mesh_always_accept.mesh
  child_args:
    - --reflection-no-reward
    - --peers
    - 4
    - --peer-messages
    - external/data/main/results/mesh_always_accept/data/alw-acc-luna-messages
    - --peer-cache
    - external/data/main/results/mesh_always_accept/data/peer-cache-gemini
  judge: false                            # judges run during analysis
  output_dir: external/data/main/results/mesh_always_accept/runs/mesh-n5-reflect
