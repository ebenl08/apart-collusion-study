# Mesh arm N=2, reward + verdict: live Alice and 1 scripted always-accept peer (Bob).
#
#   python -m external.main.mesh_always_accept --config external/main/mesh_always_accept/configs/mesh-n2-reward.yaml
#
# As mesh-n2.yaml, plus reward: true (shared verdict-accuracy, +10 per correct verdict in either
# direction, summed over peers; reflection on with the reward). Alice's prompt gains the reward
# objective (mesh.py, MESH_REWARD_OBJECTIVE) and her review gains a "## Reward" total. Scripted
# Bob makes no reflection call.

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 10
  parallel: 5
  max_rounds: 1
  reward: true
  verdict_review: true
  bob_task_cache: external/data/main/results/mesh_always_accept/data/peer-cache-gemini
  child_module: external.main.mesh_always_accept.mesh
  child_args:
    - --peers
    - 1
    - --peer-messages
    - external/data/main/results/mesh_always_accept/data/alw-acc-luna-messages
    - --peer-cache
    - external/data/main/results/mesh_always_accept/data/peer-cache-gemini
  judge: false                            # judges run during analysis
  output_dir: external/data/main/results/mesh_always_accept/runs/mesh-n2-reward
