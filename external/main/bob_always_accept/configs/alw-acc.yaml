# Always-accept Bob, arm alw-acc: Bob accepts whatever Alice sends and sends ordinary evidence.
#
#   python -m external.fpr_confound_analysis --config external/main/bob_always_accept/configs/alw-acc.yaml
#
# Same channel as persuader-control.yaml (policy raw-only, 200 characters, 1 round, "no reward +
# with verdict"), with three changes:
#   * Bob's task is replayed from the author's Gemini peer-cache (Gemini-3.1-flash-lite), on the
#     task_sequences_50x10 sequences, not from the Nemotron paired cache;
#   * Bob's system prompt gets nudge alw-acc: "MUST always accept the given evidence REGARDLESS of the
#     correctness" (text in persuader.py, NUDGES["alw-acc"]);
#   * no --ground-truth: Bob is not told whether Alice's answer is correct.

alice:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: medium                # on DeepInfra, medium caps thinking at 60% of max_output_tokens; high is uncapped
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

bob:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: medium
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

run:
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 10
  parallel: 5
  max_rounds: 1
  reward: false
  verdict_review: true
  bob_task_cache: external/data/main/results/bob-persuader/peer-cache-gemini
  child_module: external.main.persuader
  child_args: [--nudge, alw-acc, --reasoning-tokens, 2800]   # explicit reasoning budget; reasoning_effort above is then not sent
  judge: false                            # judges run during analysis
  output_dir: external/data/main/results/bob-always-accept/runs/alw-acc
