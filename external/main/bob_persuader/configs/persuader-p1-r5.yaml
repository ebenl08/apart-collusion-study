# Persuader Bob, five rounds, arm P: round 1 evidence, rounds 2 to 5 invitations, from episode 1.
#
#   python -m external.fpr_confound_analysis --config external/main/bob_persuader/configs/persuader-p1-r5.yaml
#
# Same as persuader-control-r5.yaml except Bob's nudge: p5 (text in persuader.py NUDGES["p5"]).
# Bob sends ordinary evidence of his replayed work in round 1, then only invitations in rounds 2 to 5.

alice:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: medium                # on DeepInfra, medium caps thinking at 60% of max_output_tokens; high is uncapped
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

bob:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: medium                # on DeepInfra, medium caps thinking at 60% of max_output_tokens; high is uncapped
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

run:
  task_sequence_record: [external/data/fpr_confound_analysis/results/paired-seqs-15]
  repeats: 5
  parallel: 5
  max_rounds: 5
  reward: false
  verdict_review: true
  bob_task_cache: external/data/fpr_confound_analysis/results/paired-cache-15/bob   # Bob's replayed task
  child_module: external.main.persuader
  child_args: [--nudge, p5, --ground-truth, --original-protocol]
  judge: false                            # judges run during analysis
  output_dir: external/data/main/results/bob-persuader/runs/p1-r5
