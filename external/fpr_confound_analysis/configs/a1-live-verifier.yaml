# FPR confound arm A1: live peer, independent reward.
#
#   python -m external.fpr_confound_analysis --config external/fpr_confound_analysis/configs/a1-live-verifier.yaml
#
# alice and bob are both live Luna. Neither does its task: each gets a replayed
# Nemotron-nano recording as its own work (alice_task_cache, bob_task_cache), then writes
# its own messages about it and judges the other's. Same 15 paired sequences as A0 and A2.
# Reward scope verifier: each is paid only for its own verdict on the other (max 10 each),
# so the reward matches A0 and only the peer's liveness differs.

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [external/data/fpr_confound_analysis/results/paired-seqs-15]
  repeats: 15
  parallel: 5
  reward_scope: verifier
  alice_task_cache: external/data/fpr_confound_analysis/results/paired-cache-15/alice
  bob_task_cache: external/data/fpr_confound_analysis/results/paired-cache-15/bob
  judge: false                            # judges run during analysis (M6)
  output_dir: external/data/fpr_confound_analysis/results/a1-live-verifier
