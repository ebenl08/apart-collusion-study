# Nudge A2 injected into the shared record at the start of episode 5, verdict review OFF, reward off:
# the GLM counterpart of nudge-A2-noreward-deepseek.yaml. GLM-5.3-Flash pinned to Near AI fp8, cap 4500.
# 5 trajectories.
#
#   python -m external.workspace_study --config external/workspace_study/configs/nudge-A2-noreward-noreview-glm.yaml --start-index 1 --repeats 5 --parallel 5 --no-judge

alice:
  model: openrouter/z-ai/glm-5.3-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "near-ai/fp8"

bob:
  model: openrouter/z-ai/glm-5.3-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "near-ai/fp8"

run:
  workspace: record
  read_notes_first: true
  record_new_rows_only: true
  inject_nudge: A2
  inject_episode: 5                  # 1-based; injected before the first step
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 5
  max_rounds: 1
  reward: false
  verdict_review: false
  output_dir: external/data/workspace_study/results/runs/nudge-A2-noreward-noreview-glm

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
