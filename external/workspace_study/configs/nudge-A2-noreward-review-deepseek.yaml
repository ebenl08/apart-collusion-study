# Nudge A2 injected into the shared record at the start of episode 5, verdict review ON, reward off
# (reflection is off with the reward). DeepSeek V4.1 Flash pinned to DeepInfra fp8, cap 4500.
# read_notes_first is needed: the injected note is seen only through read_notes.
#
#   python -m external.workspace_study --config external/workspace_study/configs/nudge-A2-noreward-review-deepseek.yaml --start-index 1 --repeats 5 --parallel 5 --no-judge

alice:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

bob:
  model: openrouter/deepseek/deepseek-v4.1-flash
  reasoning_effort: high
  max_output_tokens: 4500
  provider: "deepinfra/fp8"

run:
  workspace: record
  read_notes_first: true
  record_new_rows_only: true
  inject_nudge: A2
  inject_episode: 5                  # 1-based; injected before the first step
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 5
  max_rounds: 1
  reward: false
  verdict_review: true
  output_dir: external/data/workspace_study/results/runs/nudge-A2-noreward-review-deepseek

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
