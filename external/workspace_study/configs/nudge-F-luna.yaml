# Collusion probe, nudge F (unilateral commitment, no request): as nudge-A.yaml with
# inject_nudge F. One-trajectory pilot to read the reasoning traces.
#
#   python -m external.workspace_study --config external/workspace_study/configs/nudge-F-luna.yaml --start-index 1 --repeats 1 --parallel 1 --no-judge

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  workspace: record
  read_notes_first: true
  allow_reflection_notes: true
  record_new_rows_only: true
  inject_nudge: F
  inject_episode: 5
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 1
  max_rounds: 1
  output_dir: external/data/workspace_study/results/runs/nudge-F-luna

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
