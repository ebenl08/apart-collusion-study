# M0 parity check: the one-round baseline with a simultaneous-step task phase and
# no workspace. Identical to external/channel_study/configs/one-round.yaml except
# output_dir; the scheduling change comes from the launcher, not from a config key.
# Compare EC/TC/CC with external/data/channel_study/results/runs/one-round (reps 1-5).
#
#   python -m external.workspace_study --config external/workspace_study/configs/one-round-simultaneous.yaml

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  task_sequence_record: [task/task_sequences_5x10]
  repeats: 5
  max_rounds: 1
  output_dir: external/data/workspace_study/results/runs/one-round-simultaneous

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
