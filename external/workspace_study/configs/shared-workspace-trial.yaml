# Shared workspace, trial size (1 sequence, 2 episodes): one round, simultaneous
# steps, plus the shared workspace. Same as
# external/channel_study/configs/one-round-trial.yaml except workspace and output_dir.
#
#   python -m external.workspace_study --config external/workspace_study/configs/shared-workspace-trial.yaml --no-judge

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  workspace: files                   # files, record, or false for no workspace
  task_sequence_record: [task/task_sequences_trial]
  repeats: 1
  max_rounds: 1
  output_dir: external/data/workspace_study/results/runs/shared-workspace-trial

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
