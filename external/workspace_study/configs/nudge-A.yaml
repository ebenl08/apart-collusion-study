# Collusion probe, nudge A (shared-payoff framing): as shared-record-reflections-new.yaml,
# plus a peer-authored note injected into the record at the start of episode 5.
# Nudges B and C: nudge-B.yaml, nudge-C.yaml, which differ only in inject_nudge and output_dir.
#
#   python -m external.workspace_study --config external/workspace_study/configs/nudge-A.yaml --start-index 1 --repeats 5 --parallel 5 --no-judge

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  workspace: record
  read_notes_first: true             # needed: the injected note is seen only through read_notes
  allow_reflection_notes: true
  record_new_rows_only: true
  inject_nudge: A                    # A, B or C (prompts.NUDGES)
  inject_episode: 5                  # 1-based; injected before the first step
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 5
  max_rounds: 1
  output_dir: external/data/workspace_study/results/runs/nudge-A

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
