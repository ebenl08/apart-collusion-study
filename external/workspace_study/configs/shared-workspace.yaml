# Shared workspace: one round, simultaneous steps, plus the shared workspace.
# Same as external/channel_study/configs/one-round-50x10.yaml except workspace and
# output_dir. Reps 1-5 of the 50x10 set are the 5x10 sequences, so the pilot compares
# with runs/one-round (sequential) and runs/one-round-simultaneous.
#
#   python -m external.workspace_study --config external/workspace_study/configs/shared-workspace.yaml --start-index 1 --repeats 5 --parallel 5 --no-judge

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  workspace: files                   # files, record, or false for no workspace
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 25
  max_rounds: 1
  output_dir: external/data/workspace_study/results/runs/shared-workspace

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
