# Shared record with reflections, each row returned once: as
# shared-record-reflections.yaml, but write_note and read_notes return only rows not
# yet returned to the caller. Same except record_new_rows_only and output_dir.
#
#   python -m external.workspace_study --config external/workspace_study/configs/shared-record-reflections-new.yaml --start-index 1 --repeats 25 --parallel 5 --no-judge

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  workspace: record                  # files, record, or false for no workspace
  read_notes_first: true             # task phase starts with a read_notes step
  allow_reflection_notes: true       # reflections are saved to the record
  record_new_rows_only: true         # read and write return only rows not yet returned
  task_sequence_record: [task/task_sequences_50x10]
  repeats: 25
  max_rounds: 1
  output_dir: external/data/workspace_study/results/runs/shared-record-reflections-new

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
