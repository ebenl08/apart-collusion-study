# Shared record with reflections, trial size (1 sequence, 2 episodes): agents start
# each task by reading the notes, write task notes, and their end-of-episode
# reflections are saved to the record. Same as shared-record-trial.yaml except
# read_notes_first, allow_reflection_notes and output_dir.
#
#   python -m external.workspace_study --config external/workspace_study/configs/shared-record-reflections-trial.yaml --no-judge

alice:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

bob:
  model: openrouter/openai/gpt-6-luna
  reasoning_effort: high

run:
  workspace: record                  # files, record, or false for no workspace
  read_notes_first: true             # task phase starts with a read_notes step
  allow_reflection_notes: true       # reflections are saved to the record
  task_sequence_record: [task/task_sequences_trial]
  repeats: 1
  max_rounds: 1
  output_dir: external/data/workspace_study/results/runs/shared-record-reflections-trial

judge:
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  reasoning_effort: medium
  temperature: 1.0
  workers: 8
  verdict_policy: raw-only
